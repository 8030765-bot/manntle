<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Mantle</title> <style> * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #09090b; color: white; font-family: Arial, Helvetica, sans-serif; } .container { text-align: center; padding: 30px; } h1 { margin: 0 0 12px; font-size: 42px; font-weight: 700; letter-spacing: 2px; } p { margin: 0 0 30px; color: #a1a1aa; font-size: 17px; } .download-button { display: inline-block; padding: 15px 30px; background: #ffffff; color: #09090b; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer; transition: transform 0.2s ease, background 0.2s ease; } .download-button:hover { background: #e4e4e7; transform: translateY(-2px); } .download-button:active { transform: translateY(0); } </style> </head> <body> <div class="container"> <h1>MANTLE</h1> <p>Download and open the file, then play.</p> <button class="download-button" onclick="downloadMantle()" > Download Mantle.html </button> </div> <script> async function downloadMantle() { try { const response = await fetch("/Mantle.html", { cache: "no-store" }); if (!response.ok) { throw new Error("Could not find Mantle.html"); } const blob = await response.blob(); const url = window.URL.createObjectURL(blob); const link = document.createElement("a"); link.href = url; link.download = "Mantle.html"; document.body.appendChild(link); link.click(); document.body.removeChild(link); window.URL.revokeObjectURL(url); } catch (error) { alert( "The Mantle.html file could not be downloaded. " + "Make sure Mantle.html is uploaded to the same Vercel project." ); console.error(error); } } </script> </body> </html>
